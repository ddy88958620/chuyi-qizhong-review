<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="初一上期中考试在线复习站：生物、历史、道法、地理、语文、数学、英语七科知识点、填空自测、选择题刷题、识图速查与抽背卡片。">
<title>初一上 · 期中在线复习</title>
<link rel="stylesheet" href="assets/style.css?v=20261115">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" id="brandLink"><span class="brand-mark">📚</span><span>初一上 · 期中在线复习</span></a>
  <div class="top-actions">
    <button class="icon-btn" id="searchBtn" title="全站搜索" aria-label="全站搜索">🔍 <span>搜索</span></button>
    <button class="icon-btn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色">🌙</button>
    <a class="icon-btn" id="githubLink" href="#" target="_blank" rel="noopener" title="在 GitHub 查看源码" aria-label="GitHub">GH</a>
  </div>
</header>
<div id="focusBar" class="focus-bar" role="status" aria-live="polite">
  <span class="focus-label">🎯 专注学习</span><span>有效 <b data-focus-time>00:00</b> / <b data-focus-goal>15:00</b></span>
  <span class="focus-away">离开 <b data-focus-away>0</b> 次</span>
  <button class="btn small primary" id="focusStart" data-focus-start>开始专注</button>
  <button class="btn small ghost" id="focusEnd">结束</button>
</div>
<main id="app" tabindex="-1"></main>

<footer class="footer">
  <p>历史 / 地理 / 生物 / 道德与法治已接入人教版/统编版2024秋七上目录和知识主线；旧校内或旧版本资料均标注待迁移。语文、数学、英语按人教版/统编版2024秋教材自主整理，非校内原卷 · 仅作个人复习使用，答案以老师课堂讲授为准</p>
  <p>纯静态页面，无需联网；复习进度保存在本机浏览器（localStorage）</p>
</footer>

<button id="backTop" class="back-top" aria-label="回到顶部" title="回到顶部">↑</button>

<div id="searchOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="全站搜索">
  <div class="overlay-panel search-panel">
    <div class="overlay-head">
      <input id="searchInput" type="search" placeholder="搜索知识点、题目、答案…" autocomplete="off">
      <button class="icon-btn" id="searchClose" aria-label="关闭">✕</button>
    </div>
    <div id="searchResults" class="search-results"><p class="muted">输入关键词，例如「显微镜」「分封制」「友谊」「经纬网」「绝对值」「观沧海」「there be」。</p></div>
  </div>
</div>

<div id="focusOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="抽背卡片">
  <div class="overlay-panel focus-panel">
    <div class="overlay-head"><strong id="focusTitle">抽背</strong><button class="icon-btn" id="focusClose" aria-label="关闭">✕</button></div>
    <div id="focusBody" class="focus-body"></div>
    <div class="focus-actions">
      <button class="btn ghost" id="focusPrev">上一张</button>
      <button class="btn primary" id="focusReveal">显示答案</button>
      <button class="btn ghost" id="focusNext">下一张</button>
    </div>
  </div>
</div>

<script src="data/bio.js?v=20261115"></script>
<script src="data/his.js?v=20261115"></script>
<script src="data/df.js?v=20261115"></script>
<script src="data/geo.js?v=20261115"></script>
<script src="data/zh.js?v=20261115"></script>
<script src="data/math.js?v=20261115"></script>
<script src="data/eng.js?v=20261115"></script>
<script src="assets/app.js?v=20261115"></script>
</body>
</html>
